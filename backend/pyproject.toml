[project]
name = "gameclub-backend"
version = "0.1.0"
description = "Async backend foundation for a gaming club management system"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "dramatiq[redis]>=1.17,<2",
    "fastapi>=0.115,<1",
    "grpcio>=1.68,<2",
    "grpcio-health-checking>=1.68,<2",
    "hiredis>=3,<4",
    "PyJWT>=2.9,<3",
    "pydantic-settings>=2.7,<3",
    "redis>=5.2,<7",
    "sqlalchemy[asyncio]>=2,<3",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.68,<2",
    "httpx>=0.28,<1",
    "mypy>=1.14,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "pytest-cov>=7.1.0",
    "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gameclub_backend", "src/gameclub"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]
exclude = ["src/gameclub/v1"]

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["gameclub_backend"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
pythonpath = ["src"]
markers = [
    "unit: быстрые тесты доменных и application-правил без внешней инфраструктуры",
    "api: тесты публичных HTTP/gRPC API с контролируемыми transport boundaries",
    "contract: тесты protobuf, transport и platform contract",
    "integration: тесты с реальными инфраструктурными адаптерами",
    "postgres: тесты, требующие GAMECLUB_TEST_POSTGRES_DSN",
    "redis: тесты, требующие GAMECLUB_TEST_REDIS_URL",
    "concurrency: тесты конкурентности, блокировок и идемпотентности",
    "slow: длительные или инфраструктурно-зависимые тесты",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
ignore_missing_imports = true
exclude = "^src/gameclub/v1/"

[[tool.mypy.overrides]]
module = ["gameclub.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/gameclub_backend"]

[tool.coverage.report]
fail_under = 70
skip_empty = true
