syntax = "proto3";

package gameclub.clients.v1;

option csharp_namespace = "GameClub.Client.Contracts.Clients.V1";

import "google/protobuf/timestamp.proto";

service ClientService {
  rpc Create(CreateClientRequest) returns (Client);
  rpc Search(SearchClientsRequest) returns (SearchClientsResponse);
  rpc Get(GetClientRequest) returns (Client);
  rpc TopUp(TopUpRequest) returns (TopUpResponse);
  rpc ListBalanceOperations(ListBalanceOperationsRequest) returns (ListBalanceOperationsResponse);
  rpc CreateGuest(CreateGuestRequest) returns (Guest);
  rpc SearchGuests(SearchGuestsRequest) returns (SearchGuestsResponse);
  rpc GetGuest(GetGuestRequest) returns (Guest);
  rpc ListGuests(ListGuestsRequest) returns (ListGuestsResponse);
}

service ClientPortalService {
  rpc Register(RegisterPortalRequest) returns (ClientPortalSession);
  rpc Login(LoginPortalRequest) returns (ClientPortalSession);
  rpc Get(GetPortalRequest) returns (ClientPortalSnapshot);
  rpc ActivateEntitlement(ActivateEntitlementRequest) returns (ClientPortalSnapshot);
}

message Client {
  string id = 1;
  string nickname = 2;
  string phone = 3;
  string discount_category = 4;
  int64 balance_cents = 5;
  int64 balance_bonus = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  google.protobuf.Timestamp blocked_at = 9;
}

message CreateClientRequest {
  string nickname = 1;
  string phone = 2;
  string discount_category = 3;
}

message SearchClientsRequest {
  string query = 1;
  enum Field {
    FIELD_UNSPECIFIED = 0;
    FIELD_NICKNAME = 1;
    FIELD_PHONE = 2;
  }
  Field field = 2;
}

message SearchClientsResponse {
  repeated Client clients = 1;
}

message GetClientRequest {
  string client_id = 1;
}

message TopUpRequest {
  string client_id = 1;
  int64 amount_cents = 2;
  int64 bonus_amount = 3;
  string reason = 4;
  string idempotency_key = 5;
  repeated PaymentPart payment_parts = 6;
}

message PaymentPart {
  string method = 1;
  int64 amount_cents = 2;
  string reference = 3;
}

message TopUpResponse {
  Client client = 1;
  string operation_id = 2;
  string idempotency_key = 3;
}

message BalanceOperation {
  string id = 1;
  string client_id = 2;
  string operation_type = 3;
  int64 amount_cents = 4;
  int64 bonus_amount = 5;
  string reason = 6;
  string actor_id = 7;
  string idempotency_key = 8;
  google.protobuf.Timestamp created_at = 9;
  repeated PaymentPart payment_parts = 10;
}

message ListBalanceOperationsRequest {
  string client_id = 1;
  int32 limit = 2;
}

message ListBalanceOperationsResponse {
  repeated BalanceOperation operations = 1;
}

message Guest {
  string id = 1;
  string nickname = 2;
  string phone = 3;
  string discount_category = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message CreateGuestRequest {
  string nickname = 1;
  string phone = 2;
  string discount_category = 3;
}

message SearchGuestsRequest {
  string query = 1;
  enum Field {
    FIELD_UNSPECIFIED = 0;
    FIELD_NICKNAME = 1;
    FIELD_PHONE = 2;
  }
  Field field = 2;
}

message SearchGuestsResponse {
  repeated Guest guests = 1;
}

message GetGuestRequest {
  string guest_id = 1;
}

message ListGuestsRequest {}

message ListGuestsResponse {
  repeated Guest guests = 1;
}

message RegisterPortalRequest {
  string nickname = 1;
  string phone = 2;
  string pin = 3;
  string device_id = 4;
}

message LoginPortalRequest {
  string identifier = 1;
  string pin = 2;
  string device_id = 3;
}

message GetPortalRequest {
  string device_id = 1;
  int32 limit = 2;
}

message ActivateEntitlementRequest {
  string entitlement_id = 1;
  string device_id = 2;
}

message ClientPortalSession {
  string access_token = 1;
  int32 expires_in = 2;
  ClientPortalSnapshot snapshot = 3;
}

message ClientPortalSnapshot {
  Client client = 1;
  repeated PortalBalanceOperation balance_operations = 2;
  repeated PortalSession sessions = 3;
  repeated PortalCharge charges = 4;
  repeated PortalPurchase purchases = 5;
  int64 available_time_minutes = 6;
  repeated PortalEntitlement entitlements = 7;
}

message PortalEntitlement {
  string id = 1;
  string tariff_id = 2;
  string zone_id = 3;
  int32 duration_minutes = 4;
  int32 remaining_minutes = 5;
  int64 price_cents = 6;
  int32 queue_position = 7;
  string status = 8;
  string tariff_name = 9;
  google.protobuf.Timestamp purchased_at = 10;
  google.protobuf.Timestamp activated_at = 11;
}

message PortalBalanceOperation {
  string id = 1;
  string operation_type = 2;
  int64 amount_cents = 3;
  int64 bonus_amount = 4;
  string reason = 5;
  google.protobuf.Timestamp created_at = 6;
  repeated PaymentPart payment_parts = 7;
}

message PortalSession {
  string id = 1;
  string workstation_id = 2;
  string status = 3;
  google.protobuf.Timestamp started_at = 4;
  google.protobuf.Timestamp ended_at = 5;
  string tariff_id = 6;
  int32 tariff_quantity = 7;
  string tariff_name = 8;
}

message PortalCharge {
  string id = 1;
  string session_id = 2;
  string tariff_id = 3;
  int32 duration_minutes = 4;
  int64 amount_cents = 5;
  google.protobuf.Timestamp created_at = 6;
  string tariff_name = 7;
}

message PortalPurchase {
  string id = 1;
  string product_name = 2;
  int32 quantity = 3;
  int64 total_price_cents = 4;
  string payment_method = 5;
  google.protobuf.Timestamp created_at = 6;
}
