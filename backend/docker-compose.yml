services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gameclub
      POSTGRES_USER: gameclub
      POSTGRES_PASSWORD: ${GAMECLUB_DB_PASSWORD:?Set GAMECLUB_DB_PASSWORD for local development}
    ports:
      - "55432:5432"
    volumes:
      - gameclub-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gameclub -d gameclub"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    volumes:
      - gameclub-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gameclub-postgres-data:
  gameclub-redis-data:
