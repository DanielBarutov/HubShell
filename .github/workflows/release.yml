name: Build HubShell release
on:
  push:
    branches: ['main']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm --prefix ./frontend ci
      - run: npm --prefix ./frontend test -- src/features/settings/ClientUpdateStatus.test.tsx src/features/settings/BonusProgramSettings.test.tsx src/api/client.test.ts
      - run: npm --prefix ./frontend run build
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      GAMECLUB_TEST_POSTGRES_DSN: postgresql+asyncpg://postgres:ci-test-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned uv
        run: |
          python3 -m venv "$RUNNER_TEMP/ci-tools"
          "$RUNNER_TEMP/ci-tools/bin/pip" install uv==0.11.19
          echo "$RUNNER_TEMP/ci-tools/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Compose configuration checks
        run: python3 scripts/check-compose.py
      - name: Backend deployment and admission checks
        run: |
          uv sync --directory ./backend --frozen
          uv run --directory ./backend python scripts/generate_proto.py
          GAMECLUB_POSTGRES_DSN="$GAMECLUB_TEST_POSTGRES_DSN" uv run --directory ./backend alembic upgrade head
          uv run --directory ./backend pytest tests/test_client_update_domain.py tests/test_client_update_postgres.py tests/test_client_update_http_postgres.py tests/test_client_update_agent_e2e.py tests/test_session_admission_postgres.py tests/test_session_transfer.py tests/test_modules_reservations_sessions.py tests/test_api_reservations_sessions_billing.py -q
  build:
    if: github.event_name != 'pull_request'
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Packaging contract tests
        run: |
          python3 scripts/test-build-client-release.py
          python3 scripts/test-client-release.py
          python3 scripts/test-client-update-cd.py
          python3 scripts/test-server-deployment.py
          python3 scripts/test-cd-http.py
          python3 scripts/test-deploy-release.py
      - name: Client tests
        run: dotnet test win-client/tests/GameClub.Client.Tests.csproj -c Release -p:Platform=x64
      - name: Publish Windows GUI and standalone service
        shell: bash
        env:
          CLIENT_UPDATE_SIGNING_KEY_PEM: ${{ secrets.CLIENT_UPDATE_SIGNING_KEY_PEM }}
        run: |
          set -euo pipefail
          test -n "$CLIENT_UPDATE_SIGNING_KEY_PEM" || { echo "Configure CLIENT_UPDATE_SIGNING_KEY_PEM before publishing releases"; exit 1; }
          release_id="commit-$GITHUB_SHA"
          if [ "$GITHUB_REF_TYPE" = tag ]; then release_id="$GITHUB_REF_NAME"; fi
          dotnet publish win-client/src/GameClub.Client.Windows/GameClub.Client.Windows.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=false -p:EnableCompressionInSingleFile=false -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false -p:InformationalVersion="$GITHUB_SHA" -p:HubShellReleaseId="$release_id" -o output/client
          dotnet publish win-client/src/GameClub.Client.Watchdog/GameClub.Client.Watchdog.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=false -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false -o output/watchdog
          umask 077
          key_path="$RUNNER_TEMP/hubshell-release-signing.pem"
          trap 'rm -f "$key_path"' EXIT
          printf '%s' "$CLIENT_UPDATE_SIGNING_KEY_PEM" > "$key_path"
          python3 scripts/build-client-release.py --client output/client/HubShell.exe --watchdog output/watchdog/HubShell.Watchdog.exe --output output/release --release-id "$release_id" --commit "$GITHUB_SHA" --signing-key "$key_path"
      - name: Build and publish images by commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image_root="ghcr.io/${GITHUB_REPOSITORY,,}"
          for component in backend frontend steam-guest; do
            image="$image_root/$component:$GITHUB_SHA"
            if [ "$component" = steam-guest ]; then
              docker build --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$GITHUB_SHA" -f steam-guest/src/HubShell.SteamGuest.Server/Dockerfile -t "$image" steam-guest
            else
              docker build --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$image" "$component"
            fi
            docker push "$image"
            docker pull "$image"
            digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image")
            key=${component^^}
            key=${key//-/_}
            printf 'HUBSHELL_%s_IMAGE=%s\n' "$key" "$digest" >> output/release/images.env
          done
          printf '%s\n' "$GITHUB_SHA" > output/release/commit.txt
      - name: Sign server image manifest
        shell: bash
        env:
          CLIENT_UPDATE_SIGNING_KEY_PEM: ${{ secrets.CLIENT_UPDATE_SIGNING_KEY_PEM }}
        run: |
          set -euo pipefail
          umask 077
          key_path="$RUNNER_TEMP/hubshell-server-signing.pem"
          trap 'rm -f "$key_path"' EXIT
          printf '%s' "$CLIENT_UPDATE_SIGNING_KEY_PEM" > "$key_path"
          python3 scripts/sign-server-release.py --directory output/release --signing-key "$key_path"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hubshell-${{ github.sha }}
          path: output/release/
          if-no-files-found: error
      - name: Create draft GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" output/release/* --verify-tag --draft --title "$GITHUB_REF_NAME" --notes "HubShell build $GITHUB_SHA. Client installation still requires the coordinated deployment barrier."
