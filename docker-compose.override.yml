services:
  frontend:
    build:
      target: dev
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "3101"]
    environment:
      VITE_PROXY_TARGET: http://backend-http:8100
      VITE_GAMECLUB_DATA_MODE: mock
    ports:
      - "127.0.0.1:${GAMECLUB_FRONTEND_DEV_PORT:-3101}:3101"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules

volumes:
  frontend-node-modules:
